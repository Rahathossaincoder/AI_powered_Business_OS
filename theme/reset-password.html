<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Wavespace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f3f4f6] p-4">

  <!-- AUTH CARD -->
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-8 space-y-6 shadow-sm">
    
    <!-- BRAND LOGO -->
    <div class="flex flex-col items-center text-center space-y-2">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm">
        W
      </div>
      <h1 class="text-xl font-bold text-gray-900">Reset your password</h1>
      <p class="text-xs text-gray-500">Enter your email address to receive password reset instructions</p>
    </div>

    <!-- FORM -->
    <form onsubmit="event.preventDefault(); alert('Reset link sent to your email!'); window.location.href='login.html';" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-gray-900 mb-1">Email Address</label>
        <input type="email" required placeholder="shahid@company.com" class="w-full px-3.5 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-indigo-600 text-xs">
      </div>

      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-colors shadow-2xs">
        Send Reset Link
      </button>
    </form>

    <!-- FOOTER LINK -->
    <div class="text-center text-xs text-gray-500 border-t border-gray-100 pt-4">
      Remembered your password? <a href="login.html" class="font-semibold text-indigo-600 hover:underline">Return to sign in</a>
    </div>

  </div>

</body>
</html>
