<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Wavespace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f3f4f6] p-4">

  <!-- AUTH CARD -->
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-8 space-y-6 shadow-sm">
    
    <!-- BRAND LOGO -->
    <div class="flex flex-col items-center text-center space-y-2">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-sm">
        W
      </div>
      <h1 class="text-xl font-bold text-gray-900">Sign in to Wavespace</h1>
      <p class="text-xs text-gray-500">Enter your credentials to access your workspace</p>
    </div>

    <!-- FORM -->
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-gray-900 mb-1">Email Address</label>
        <input type="email" required value="shahid@wavespace.io" placeholder="name@company.com" class="w-full px-3.5 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-indigo-600 text-xs">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="font-semibold text-gray-900">Password</label>
          <a href="reset-password.html" class="text-indigo-600 font-medium hover:underline">Forgot password?</a>
        </div>
        <input type="password" required value="••••••••••••" placeholder="Enter password" class="w-full px-3.5 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-indigo-600 text-xs">
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" checked id="remember" class="w-4 h-4 rounded text-indigo-600 accent-indigo-600 cursor-pointer">
        <label for="remember" class="text-gray-600 cursor-pointer">Remember this device for 30 days</label>
      </div>

      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-colors shadow-2xs">
        Sign In to Dashboard
      </button>
    </form>

    <!-- FOOTER LINK -->
    <div class="text-center text-xs text-gray-500 border-t border-gray-100 pt-4">
      Don't have an account? <a href="signup.html" class="font-semibold text-indigo-600 hover:underline">Sign up for Wavespace</a>
    </div>

  </div>

</body>
</html>
